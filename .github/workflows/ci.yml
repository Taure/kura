name: CI

on:
  # No paths-ignore here: the release job below needs the test jobs, so a
  # push they did not run for would not be released.
  push:
    branches: [main]
  pull_request:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'LICENSE'
      - '.gitignore'

  # paths-ignore means a docs-only stretch produces no CI run at all, so a
  # dependency moving underneath a pin goes unnoticed. A weekly run catches
  # rot that no commit would have triggered.
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.2.5
    # The most a job of that workflow may ask for, not what each one gets.
    # Two of its jobs declare a write scope, and GitHub refuses the run
    # unless the caller grants them: dependency-submission (contents: write,
    # for the dependency graph API) and summary (pull-requests: write, for
    # the PR comment). Every other job, including all that build or run this
    # repository's code, takes the workflow's own default, contents: read.
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      otp-matrix: '["28", "29"]'
      enable-ct: true
      enable-ex-doc: true
      enable-hank: true
      enable-sheldon: false
      enable-audit: true
      enable-coverage: true
      enable-sbom: false
      enable-sbom-scan: false
      enable-dependency-submission: true
      enable-summary: true
      # Diff-scoped: only lines a PR changes are mutated, so this gates
      # new code without a retroactive sweep of every existing test.
      enable-mutate: true
      mutate-diff: true
      mutate-min-score: 75
      # kura_db's mapped suites take about 8 s locally; 5 s timed out its mutants.
      mutate-args: '--timeout 20000'
      enable-elp-lint: true
      enable-elp-eqwalize: true

      extra-services-compose: 'docker-compose.ci.yml'

  # The suites again on every other supported PostgreSQL major; `ci` above
  # runs them on 16, the image docker-compose.ci.yml defaults to.
  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '14'
            image: pgvector/pgvector:0.8.3-pg14@sha256:3c3e63415e7791ea214538973c1cbaadebe5046cb660a6b76724b9fa6447ac8d
          - postgres: '15'
            image: pgvector/pgvector:0.8.3-pg15@sha256:3073dc147f5b0ca05b36e10e04e73ca180b1e726e453c72a6fcc85f788afd0d1
          - postgres: '17'
            image: pgvector/pgvector:0.8.3-pg17@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
          - postgres: '18'
            image: pgvector/pgvector:0.8.3-pg18@sha256:c8a919765f2ef63681329fa21021b830cd4d79d1165bdca730dd016014e4da84
    runs-on: ubuntu-24.04
    # Steps of its own, not the reusable workflow: that one has jobs that
    # declare write permissions, and GitHub makes the caller grant them even
    # when those jobs are switched off. These legs only read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: Taure/erlang-ci@v2.2.5
        with:
          version-file: '.tool-versions'
      - name: Start PostgreSQL
        env:
          KURA_POSTGRES_IMAGE: ${{ matrix.image }}
        run: docker compose -f docker-compose.ci.yml up -d --wait
      - name: EUnit
        run: rebar3 eunit
      - name: Common Test
        run: rebar3 ct

  # Tags and releases a push to main once it passed on every PostgreSQL
  # major: a failure in `ci` or in any `postgres` leg skips it.
  release:
    needs: [ci, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Taure/erlang-ci/.github/workflows/release.yml@v2.3.2
    permissions:
      contents: write

  hex-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Taure/erlang-ci/.github/workflows/hex-publish.yml@v2.3.2
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag }}
