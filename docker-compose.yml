services:
  postgres:
    # pgvector >= 0.8.2 (CVE-2026-3172), pinned by digest. KURA_POSTGRES_IMAGE
    # runs the suites against another PostgreSQL major; the CI matrix lists
    # the image of each.
    image: ${KURA_POSTGRES_IMAGE:-pgvector/pgvector:0.8.3-pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: kura_test
      # The 18 image moved its data directory; this keeps one mount for every major.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5555:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kura_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
